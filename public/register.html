<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registratie pagina</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>
<div>
    <div class="container">
        <h1>Registratie</h1>
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <label for="name">Gebruikersnaam:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="email">E-mailadres:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Wachtwoord:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Registreren</button>
        </form>
        <p class="text-secondary">Al een account? <a class="link" id="loginButton">Inloggen</a></p>
    </div>

    <script>

        const loginButton = document.getElementById('loginButton');
        loginButton.addEventListener('click', function() {
            window.location.href = "index.html";
        });


        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            fetch('http://localhost:8000/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    let successMessage = document.getElementById('successMessage');
                    let errorMessage = document.getElementById('errorMessage');

                    successMessage.textContent = 'Het registreren is gelukt!';
                    errorMessage.textContent = '';

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                } else {
                    throw new Error('De registratie is mislukt');
                }
            })
            .catch(error => {
                console.error(error);
                let successMessage = document.getElementById('successMessage');
                let errorMessage = document.getElementById('errorMessage');
                
                errorMessage.textContent = 'Er is iets fout gegaan bij het registreren';
                successMessage.textContent = '';
            });
        });
    </script>
</body>
</html>
