<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/auth.css">
    <title>Loginpagina</title>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <label for="username">Gebruikersnaam:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Wachtwoord:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Inloggen</button>
        </form>
        <p class="text-secondary">Geen account? <a class="link" id="registerButton">Registreren</a></p>
    </div>

    <script>

        const registerButton = document.getElementById('registerButton');
        registerButton.addEventListener('click', function() {
            window.location.href = "register.html";
        });

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            fetch('http://localhost:8000/api/login_check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Inloggen mislukt');
                }
            })
            .then(data => {
                let successMessage = document.getElementById('successMessage');
                let errorMessage = document.getElementById('errorMessage');

                successMessage.textContent = 'Je bent succesvol ingelogd!';
                errorMessage.textContent = '';
                localStorage.setItem('jwt', data.token);

                setTimeout(() => {
                    window.location.href = "memory.html";
                }, 1500);
            })
            .catch(error => {
                console.error(error);

                let successMessage = document.getElementById('successMessage');
                let errorMessage = document.getElementById('errorMessage');
                
                errorMessage.textContent = 'Er is iets fout gegaan bij het inloggen';
                successMessage.textContent = '';
            });
        });
    </script>
</body>
</html>
